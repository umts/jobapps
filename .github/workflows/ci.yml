name: ci
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
        ports:
          - 3306:3306
    env:
      RAILS_ENV: test
      DATABASE_URL: trilogy://root@127.0.0.1:3306/jobapps_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bin/setup --skip-server
      - run: bundle exec rspec
  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bundle exec brakeman --no-pager
  haml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bundle exec haml-lint
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bundle exec rubocop
